name: Calendar snapshot
on:
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที (บันทึกไฟล์เฉพาะเมื่อข้อมูลเปลี่ยน)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build calendar-list.html
        run: python3 make_snapshot.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain calendar-list.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar-list.html
            git commit -m "Update calendar snapshot"
            git push
          fi
