<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บันทึกหุ้นของทีม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d5dce3;--acc:#2f3fa8;--onacc:#fff;
--news:#2f3fa8;--holders:#0b7a75;--other:#8a6d1f;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10161c;--panel:#18212a;--ink:#e6ecf1;--mute:#93a1ae;--line:#2a3541;--acc:#8e9bff;--onacc:#10161c;
--news:#8e9bff;--holders:#4fd1c5;--other:#e0b95a;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:4px;padding:.35rem .8rem;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:500}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:.45rem .6rem;width:100%}
h1{font-size:1.2rem;margin:0}
.mute{color:var(--mute)}
.login{max-width:380px;margin:18vh auto;padding:0 1rem}
.login form{display:grid;gap:.6rem;margin:1rem 0}
.wrap{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);padding:1rem .6rem;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail button{border:0;text-align:left;display:flex;justify-content:space-between;border-radius:4px;font-weight:500}
.rail button.on{background:var(--acc);color:var(--onacc)}
.rail i{font-style:normal;opacity:.7;font-weight:400}
main{padding:1.2rem 1.5rem;max-width:860px;width:100%}
header{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;margin-bottom:1rem}
header span{margin-left:auto;color:var(--mute);font-size:.85rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.bar #q{flex:1 1 200px;width:auto}
.seg{display:flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{border-top:1px solid var(--line);border-left:4px solid var(--c);padding:.8rem 0 .8rem 1rem}
.item summary{cursor:pointer;list-style:none;display:flex;gap:.5rem;align-items:baseline;font-weight:500}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"\203A";color:var(--mute);width:.6rem;transition:transform .15s}
.item details[open] summary::before{transform:rotate(90deg)}
.item details .body,.item details .meta{margin-left:1.1rem}
.item .tk{color:var(--c);font-weight:700}
.item .body{white-space:pre-wrap;margin:.3rem 0;max-width:70ch}
.meta{font-size:.82rem;color:var(--mute);display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.meta a{color:var(--acc)}
.meta .act{margin-left:auto;display:flex;gap:.4rem}
.meta .act button{padding:.1rem .6rem;font-size:.82rem}
.err{color:var(--bad);margin:0}
.tl{margin:.7rem 0 .7rem 1.1rem;border-left:2px solid var(--line);padding-left:.9rem}
.tl ul{padding:0;margin:.3rem 0 0}
.tl li{list-style:none;position:relative;margin:.55rem 0}
.tl li::before{content:"";position:absolute;left:-1.2rem;top:.55rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--c)}
.tl time{font-weight:500;margin-right:.5rem}
.tl small{color:var(--mute)}
.tl p{margin:.3rem 0}
.tlh{display:flex;gap:.6rem;align-items:center}
.tlh button{padding:.1rem .6rem;font-size:.82rem}
.ua{display:inline-flex;gap:.2rem;margin-left:.4rem}
.ua button{padding:0 .4rem;font-size:.78rem;border-color:transparent;color:var(--mute)}
.last{margin-left:auto;color:var(--mute);font-size:.8rem;font-weight:400}
.empty{color:var(--mute);padding:2rem 0}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;width:min(520px,94vw);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:grid;gap:.7rem}
dialog label{display:grid;gap:.2rem;font-size:.85rem;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.btns{display:flex;gap:.5rem;justify-content:flex-end}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:4px;max-width:90vw}
@media(max-width:700px){
.wrap{grid-template-columns:1fr}
.rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.5rem}
.rail button{white-space:nowrap;gap:.5rem}
main{padding:1rem}}
</style>
</head>
<body>

<div id="app" class="wrap">
  <nav class="rail" id="rail" aria-label="หุ้น"></nav>
  <main>
    <header>
      <h1>บันทึกหุ้นของทีม</h1>
      <span id="who"></span>
      
    </header>
    <div class="bar">
      <input id="q" type="search" placeholder="ค้นหาชื่อหุ้น หัวข้อ หรือเนื้อหา">
      <div class="seg" id="seg"></div>
      <button id="add" class="pri">เพิ่มบันทึก</button>
      <button id="exp">ส่งออก JSON</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<dialog id="dlg">
  <form id="f">
    <h1 id="dt">เพิ่มบันทึก</h1>
    <div class="row">
      <label>ชื่อหุ้น<input id="f-t" required list="tks" placeholder="เช่น PTT, NVDA"></label>
      <label>ประเภท<select id="f-k"></select></label>
    </div>
    <label>หัวข้อ<input id="f-h" required></label>
    <label>สรุปปัจจุบัน<textarea id="f-b" rows="7"></textarea></label>
    <label>ลิงก์แหล่งที่มา (ถ้ามี)<input id="f-u" type="url" placeholder="https://"></label>
    <label>ชื่อของคุณ<input id="f-n" required placeholder="ใช้แสดงว่าใครเป็นคนบันทึก"></label>
    <p id="ferr" class="err" role="alert" hidden></p>
    <div class="btns">
      <button type="button" id="cancel">ยกเลิก</button>
      <button class="pri">บันทึก</button>
    </div>
  </form>
  <datalist id="tks"></datalist>
</dialog>
<dialog id="udlg">
  <form id="uf">
    <h1 id="udt">เพิ่มอัปเดต</h1>
    <p id="utopic" class="mute"></p>
    <div class="row">
      <label>วันที่เกิดเหตุการณ์<input id="u-d" type="date" required></label>
      <label>ชื่อของคุณ<input id="u-n" required></label>
    </div>
    <label>รายละเอียดอัปเดต<textarea id="u-b" rows="5" required></textarea></label>
    <label>ลิงก์แหล่งที่มา (ถ้ามี)<input id="u-u" type="url" placeholder="https://"></label>
    <p id="uerr" class="err" role="alert" hidden></p>
    <div class="btns">
      <button type="button" id="ucancel">ยกเลิก</button>
      <button class="pri">บันทึก</button>
    </div>
  </form>
</dialog>
<div id="toast" hidden role="status"></div>

<script>
// ค่าเชื่อมต่ออยู่ใน config.js
const {SUPABASE_URL, SUPABASE_KEY} = window.APP_CONFIG || {};
if (!SUPABASE_URL || !SUPABASE_KEY){
  document.body.innerHTML = '<p style="padding:2rem">ไม่พบ config.js หรือยังไม่ได้ใส่ค่า Supabase ให้อัปโหลด config.js ไว้โฟลเดอร์เดียวกับ index.html</p>';
  throw new Error('missing config.js');
}

const KINDS = {news:'ข่าว', holders:'ผู้ถือหุ้น', other:'อื่นๆ'};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const openIds = new Set();
let ups = {}, uNote = null, uEdit = null;
let rows = [], kind = '', tk = '', role = null, me = null, editing = null;

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,5000)}

$('#f-k').innerHTML = Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#seg').innerHTML = [['','ทั้งหมด'],...Object.entries(KINDS)].map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('');

// ---------- ชื่อผู้บันทึก (ไม่ต้องล็อกอิน) ----------
let author = '';
try { author = localStorage.getItem('stock-notes-name') || ''; } catch(e) {}
function ferr(m){ const p = $('#ferr'); p.textContent = m; p.hidden = false; }
function showAuthor(){ $('#who').textContent = author ? 'บันทึกในนาม ' + author : ''; }
showAuthor();
load();
sb.channel('notes').on('postgres_changes',{event:'*',schema:'public',table:'notes'},load).on('postgres_changes',{event:'*',schema:'public',table:'note_updates'},load).subscribe();

// ---------- โหลดและแสดงข้อมูล ----------
async function load(){
  const [a, b] = await Promise.all([
    sb.from('notes').select('*').order('created_at',{ascending:false}),
    sb.from('note_updates').select('*').order('event_date',{ascending:false}).order('created_at',{ascending:false})]);
  if (a.error) return toast('โหลดข้อมูลไม่สำเร็จ: ' + a.error.message);
  if (b.error) toast('โหลดไทม์ไลน์ไม่สำเร็จ (รัน add-timeline.sql แล้วหรือยัง): ' + b.error.message);
  rows = a.data; ups = {};
  (b.data || []).forEach(u => (ups[u.note_id] = ups[u.note_id] || []).push(u));
  draw();
}

function draw(){
  const c = {}; rows.forEach(r => c[r.ticker] = (c[r.ticker]||0) + 1);
  const ts = Object.keys(c).sort();
  $('#rail').innerHTML = `<button data-t="" class="${tk?'':'on'}">ทุกหุ้น <i>${rows.length}</i></button>` +
    ts.map(x=>`<button data-t="${esc(x)}" class="${x===tk?'on':''}">${esc(x)} <i>${c[x]}</i></button>`).join('');
  $('#tks').innerHTML = ts.map(x=>`<option value="${esc(x)}">`).join('');
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
  const q = $('#q').value.trim().toLowerCase();
  const list = rows.filter(r => (!tk||r.ticker===tk) && (!kind||r.kind===kind) &&
    (!q || [r.ticker,r.title,r.body,...(ups[r.id]||[]).map(u=>u.body)].join(' ').toLowerCase().includes(q)));
  $('#list').innerHTML = list.length ? list.map(item).join('') : '<p class="empty">ยังไม่มีบันทึกที่ตรงกับตัวกรอง กด "เพิ่มบันทึก" เพื่อเริ่มจด</p>';
}

const fmtD = d => new Date(d + 'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
const lnk = u => /^https?:\/\//.test(u||'') ? ` <a href="${esc(u)}" target="_blank" rel="noopener">แหล่งที่มา</a>` : '';
function item(r){
  const d = new Date(r.updated_at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'});
  const us = ups[r.id] || [];
  const tl = us.length ? '<ul>' + us.map(u => `<li><time>${fmtD(u.event_date)}</time>${esc(u.body)}${lnk(u.source_url)} <small>โดย ${esc(u.created_by||'ไม่ระบุชื่อ')}</small><span class="ua"><button data-ue="${u.id}">แก้</button><button data-ud="${u.id}">ลบ</button></span></li>`).join('') + '</ul>' : '<p class="mute">ยังไม่มีอัปเดต</p>';
  return `<article class="item" style="--c:var(--${esc(r.kind)})">
    <details data-id="${r.id}"${openIds.has(r.id)?' open':''}><summary><span class="tk">${esc(r.ticker)}</span><span class="ttl">${esc(r.title)}</span>${us.length?`<span class="last">${fmtD(us[0].event_date)}</span>`:''}</summary>
    <div class="body">${esc(r.body)}</div>
    <div class="tl"><div class="tlh"><b>ไทม์ไลน์</b><button data-ua="${r.id}">เพิ่มอัปเดต</button></div>${tl}</div>
    <div class="meta"><span>${KINDS[r.kind]||''}</span><span>${esc(r.updated_by||r.created_by||'ไม่ระบุชื่อ')} แก้ไขล่าสุด ${d}</span>${lnk(r.source_url)}
    <span class="act"><button data-e="${r.id}">แก้ไข</button><button class="danger" data-d="${r.id}">ลบ</button></span></div>
    </details>
  </article>`;
}

$('#rail').onclick = e => { const b=e.target.closest('button'); if(!b) return; tk=b.dataset.t; draw(); };
$('#seg').onclick  = e => { const b=e.target.closest('button'); if(!b) return; kind=b.dataset.k; draw(); };
$('#q').oninput = draw;
$('#list').addEventListener('toggle', e => { const d = e.target.dataset; if (d && d.id) e.target.open ? openIds.add(d.id) : openIds.delete(d.id); }, true);

$('#list').onclick = async e => {
  const b = e.target.closest('button'); if(!b) return;
  if (b.dataset.ua) return openUForm(b.dataset.ua);
  if (b.dataset.ue) return openUForm(null, findU(b.dataset.ue));
  if (b.dataset.ud){
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'กดอีกครั้ง'; setTimeout(()=>{ delete b.dataset.armed; b.textContent = 'ลบ'; }, 3000); return; }
    const {error} = await sb.from('note_updates').delete().eq('id', b.dataset.ud);
    if (error) toast('ลบไม่สำเร็จ: ' + error.message); else load();
    return;
  }
  if (b.dataset.e) openForm(rows.find(r=>r.id===b.dataset.e));
  if (b.dataset.d){
    if (!b.dataset.armed){ b.dataset.armed = '1'; b.textContent = 'กดอีกครั้งเพื่อลบ'; setTimeout(()=>{ delete b.dataset.armed; b.textContent = 'ลบ'; }, 3000); return; }
    const {error} = await sb.from('notes').delete().eq('id', b.dataset.d);
    if (error) toast('ลบไม่สำเร็จ: ' + error.message); else load();
  }
};

// ---------- เพิ่ม/แก้ไข ----------
function openForm(r){
  editing = r || null;
  $('#dt').textContent = r ? 'แก้ไขบันทึก' : 'เพิ่มบันทึก';
  $('#f-t').value = r?.ticker || tk;
  $('#f-k').value = r?.kind || kind || 'news';
  $('#f-h').value = r?.title || '';
  $('#f-b').value = r?.body || '';
  $('#f-u').value = r?.source_url || '';
  $('#f-n').value = author;
  $('#ferr').hidden = true;
  $('#dlg').showModal();
}
$('#add').onclick = () => openForm();
$('#cancel').onclick = () => $('#dlg').close();

$('#f').onsubmit = async e => {
  e.preventDefault();
  const v = {ticker:$('#f-t').value.trim().toUpperCase(), kind:$('#f-k').value, title:$('#f-h').value.trim(),
             body:$('#f-b').value, source_url:$('#f-u').value.trim() || null};
  author = $('#f-n').value.trim();
  if (!author) return ferr('ใส่ชื่อของคุณก่อน');
  try { localStorage.setItem('stock-notes-name', author); } catch(e) {}
  showAuthor();
  v.updated_by = author; if (!editing) v.created_by = author;
  if (editing){
    // แก้ได้ต่อเมื่อยังไม่มีใครแก้ระหว่างที่เปิดฟอร์มอยู่
    const {data, error} = await sb.from('notes').update(v).eq('id',editing.id).eq('updated_at',editing.updated_at).select();
    if (error) return ferr('บันทึกไม่สำเร็จ: ' + error.message);
    if (!data.length){ $('#dlg').close(); await load(); return toast('มีคนแก้บันทึกนี้ไปก่อนแล้ว โหลดฉบับล่าสุดให้แล้ว กรุณาตรวจและแก้อีกครั้ง'); }
  } else {
    const {error} = await sb.from('notes').insert(v);
    if (error) return ferr('บันทึกไม่สำเร็จ: ' + error.message);
  }
  $('#dlg').close(); load();
};

// ---------- อัปเดตในไทม์ไลน์ ----------
function findU(id){ for (const k in ups){ const u = ups[k].find(x => x.id === id); if (u) return u; } }
function uerr(m){ const p = $('#uerr'); p.textContent = m; p.hidden = false; }
function openUForm(noteId, u){
  uEdit = u || null; uNote = u ? u.note_id : noteId;
  const n = rows.find(r => r.id === uNote);
  $('#udt').textContent = u ? 'แก้ไขอัปเดต' : 'เพิ่มอัปเดต';
  $('#utopic').textContent = n ? n.ticker + ' ' + n.title : '';
  $('#u-d').value = u?.event_date || new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  $('#u-b').value = u?.body || '';
  $('#u-u').value = u?.source_url || '';
  $('#u-n').value = author;
  $('#uerr').hidden = true;
  $('#udlg').showModal();
}
$('#ucancel').onclick = () => $('#udlg').close();
$('#uf').onsubmit = async e => {
  e.preventDefault();
  author = $('#u-n').value.trim();
  if (!author) return uerr('ใส่ชื่อของคุณก่อน');
  try { localStorage.setItem('stock-notes-name', author); } catch(e) {}
  showAuthor();
  const v = {event_date:$('#u-d').value, body:$('#u-b').value.trim(), source_url:$('#u-u').value.trim() || null};
  if (!v.body) return uerr('ใส่รายละเอียดอัปเดตก่อน');
  const {error} = uEdit ? await sb.from('note_updates').update(v).eq('id', uEdit.id)
                        : await sb.from('note_updates').insert({...v, note_id:uNote, created_by:author});
  if (error) return uerr('บันทึกไม่สำเร็จ: ' + error.message);
  openIds.add(uNote);
  $('#udlg').close(); load();
};

// ---------- ส่งออกสำรอง ----------
$('#exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));
  a.download = 'stock-notes-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
</script>
</body>
</html>
